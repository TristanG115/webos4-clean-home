<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Starting</title>
<!-- Boot cover (tv/cover.sh): shown over LG's own Home while the TV starts, closed as soon as our Home is up. No app code, no images: a few KB and no extra memory to speak of.
     Put a file named cover.png next to this page to show your own picture instead of the wordmark. -->
<style>
html,body{margin:0;width:100%;height:100%;background:#07090d;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#e8ecf4;cursor:none}
#bg{position:fixed;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 38%,#2b0d14 0,#12080c 38%,#07090d 78%)}
#mid{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#word{font-size:6.2vw;font-weight:200;letter-spacing:.12vw;line-height:1}
#word b{font-weight:300;color:#d6285a}
#sub{margin-top:1.6vw;font-size:1.5vw;letter-spacing:.5vw;text-transform:uppercase;color:#7d8596}
#ring{margin-top:4vw;width:3vw;height:3vw;border-radius:50%;border:.25vw solid rgba(255,255,255,.12);border-top-color:#d6285a;animation:sp 1.1s linear infinite}
#pic{display:none;max-width:70%;max-height:70%}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body><div id="bg"></div>
<div id="mid"><img id="pic" src="cover.png" onload="this.style.display='block';document.getElementById('word').style.display='none';document.getElementById('sub').style.display='none'" onerror="this.parentNode.removeChild(this)">
<div id="word">clean<b>home</b></div><div id="sub">starting up</div><div id="ring"></div></div>
<script>
// safety net: if nothing closes this page (boot.sh / home-on.sh normally do), ask the TV-side API to close it after 80 seconds
setTimeout(function(){ try { var x = new XMLHttpRequest(); x.open('GET', 'http://127.0.0.1:8765/api/cover/hide'); x.send(); } catch (e) {} }, 80000);
</script></body></html>
